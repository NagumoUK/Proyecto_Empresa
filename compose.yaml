services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    command:
      - pull
      - ${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      app:
        condition: service_started
    ports:
      - "8000:80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=60
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      app:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  octane:
    build:
      context: .
      dockerfile: Dockerfile
      target: octane
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    init: true
    ports:
      - "127.0.0.1:8002:8000"
    profiles:
      - octane
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

volumes:
  app_storage:
  ollama_data:
