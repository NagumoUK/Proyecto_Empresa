services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=60
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
    init: true
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

volumes:
  app_storage:
  app_logs:
