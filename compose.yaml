services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      app:
        condition: service_started
    ports:
      - "8000:80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=60
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
    depends_on:
      app:
        condition: service_started
    init: true
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  octane:
    build:
      context: .
      dockerfile: Dockerfile
      target: octane
    env_file:
      - .env
    environment:
      LOG_CHANNEL: stderr
    init: true
    ports:
      - "127.0.0.1:8002:8000"
    profiles:
      - octane
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage/app

volumes:
  app_storage:
